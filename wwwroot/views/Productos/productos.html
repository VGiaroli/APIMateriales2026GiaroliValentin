<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/wwwroot/css/sidebar.css">

    <link rel="stylesheet" href="/wwwroot/css/table.css">
</head>

<body>
    <div style="padding: 24px;">

        <div class="page-head">
            <div>
                <h1>Productos</h1>
                <p>Administrá el inventario de productos</p>
            </div>
            <div class="page-actions">
                <button type="button" class="btn-imprimir-informe" onclick="imprimir()" title="Generar PDF">
                    <i class="bi bi-file-earmark-pdf-fill" style="color: rgb(255, 47, 0);" aria-hidden="true"></i>
                </button>
                <button class="btn-agregar" type="button" onclick="abrirModalCrear()">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i>
                    Agregar
                </button>
            </div>
        </div>
        <hr class="hr-abajoTitulo">

        <div class="table-card">
            <img id="imgLogo" src="/wwwroot/img/logoPDF.png" style="display: none;">
            <table class="data-table" id="tablaProductos">
                <thead>
                    <tr>
                        <th>Descripcion</th>
                        <th>Estado</th>
                        <th>Porcentaje Ganancia</th>
                        <th>Precio Venta</th>
                        <th>CostoTotal</th>
                        <th class="text-center">Acción</th>
                    </tr>
                </thead>
                <tbody id="productos-tbody">
                </tbody>
            </table>
        </div>

    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalRegistro" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="editarLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitulo">Agregar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <input type="hidden" id="productoID" value="0">
                        <input type="hidden" id="costoTotal" value="0">

                        <!-- Descripción -->
                        <div class="col-12 mb-3">
                            <label for="descripcion" class="form-label fw-semibold">Descripción</label>
                            <input type="text" id="descripcion" class="form-control form-control-custom"
                                placeholder="Descripción">
                            <span class="error-field d-none text-danger" id="errorDescripcion">
                                <i class="bi bi-exclamation-circle-fill"></i> La descripción es requerida.
                            </span>
                        </div>

                        <!-- OCULTAMOS LOS ELEMENTOS DESDE EL CSS, SOLAMENTE EN EL CREAR -->
                        <!-- <div class="ocultarElementos"> -->
                            <!-- Estado-->
                            <div class="col-12 mb-3" id="contenedorEstado" style="display:none;">
                                <label for="eliminado" class="form-label fw-semibold">Estado</label>
                                <select id="eliminado" class="form-select form-control-custom">
                                    <option value="false">Activo</option>
                                    <option value="true">Inactivo</option>
                                </select>
                            </div>

                            <!-- Costo Total -->
                            <div class="col-md-6 col-12 mb-3">
                                <label for="costoTotalVisible" class="form-label fw-semibold">Costo Total</label>
                                <input type="number" id="costoTotalVisible" class="form-control form-control-custom"
                                    value="0" disabled>
                            </div>

                            <!-- Porcentaje de Ganancia -->
                            <div class="col-md-6 col-12 mb-3">
                                <label for="porcentajeGanancia" class="form-label fw-semibold">Porcentaje de Ganancia
                                    (%)</label>
                                <input type="number" id="porcentajeGanancia" class="form-control form-control-custom"
                                    value="0" oninput="actualizarPrecioVenta()">
                            </div>

                            <!-- Precio de Venta -->
                            <div class="col-md-6 col-12 mb-3">
                                <label for="precioVenta" class="form-label fw-semibold">Precio de Venta</label>
                                <input type="number" id="precioVenta" class="form-control form-control-custom" value="0"
                                    disabled>
                            </div>
                        <!-- </div> -->

                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarRegistro();">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PARA ASIGNARLE UN MATERIAL A UN PRODUCTO-->
    <div class="modal fade" id="modalAsignarMaterial" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="agregarLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitulo">ASIGNAR MATERIALES</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="composicionProductoID" value="0">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="materialID" class="form-label fw-semibold">Material</label>
                            <select id="materialID" class="form-select form-control-custom">
                                <option value="0">--Seleccionar Material--</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="cantidad" class="form-label fw-semibold">Costo unitario</label>
                            <input type="number" id="cantidad" class="form-control form-control-custom"
                                placeholder="cantidad">
                        </div>
                    </div>

                    <!-- ALERTA INPUTS NO COMPLETADOS -->
                    <div id="alerta" class="alert alert-danger mt-3 d-none" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span id="mensajeAlerta"></span>
                    </div>

                    <hr class="divider-dashed my-4">

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="text-start">Descripción Material</th>
                                    <th>Cantidad</th>
                                    <th>Precio costo unitario</th>
                                    <th>Subtotal</th>
                                    <th class="text-center">Accion</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-composicion-materiales">
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-link text-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn-custom-primary px-4" onclick="guardarMaterial();">
                        <i class="bi bi-check-circle"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

        <script src="/wwwroot/js/cdnPDF/jspdf.umd.min.js"></script>
    <script src="/wwwroot/js/cdnPDF/jspdf.plugin.autotable.min.js"></script>
    <script src="/wwwroot/js/informeProductos.js"></script>


    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/wwwroot/js/sidebar-loader.js"></script>
    <script src="/wwwroot/js/productos.js"></script>
</body>

</html>
